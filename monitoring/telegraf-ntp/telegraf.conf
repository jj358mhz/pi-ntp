# /opt/docker/stacks/telegraf-ntp/telegraf.conf
# Collects chrony NTP metrics and ships to InfluxDB v2 on raspberrypi-utility
#
# Deploy via Portainer on the ntp environment.
# Requires network_mode: host in docker-compose.yml so chronyd is reachable
# on udp://127.0.0.1:323.
#
# Note: debug=true is required — without it the agent hangs silently on first
# flush. This is a known behavior with network_mode: host + InfluxDB v2 output.
#
# Client metrics (chrony_clients measurement) are collected separately
# via cron job running chrony_clients.sh + push_chrony_clients.sh
# every 60 seconds, writing directly to InfluxDB via curl.
[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = "raspberrypi-ntp"
  omit_hostname = false
  debug = true
# ---------------------------------------------------------------------------
# Input: chrony
# Connects to chronyd via UDP 127.0.0.1:323
# Collects tracking, sources, and sourcestats metrics
#
# Note: serverstats is excluded — it requires command authentication.
# cmdallow 127.0.0.1 is present in chrony.conf for future use when
# socket-based access is configured.
# ---------------------------------------------------------------------------
[[inputs.chrony]]
  dns_lookup = false
  metrics = ["tracking", "sources", "sourcestats"]
# ---------------------------------------------------------------------------
# Input: CPU temperature
# Reads thermal zone temperatures from /sys/class/thermal/
# On Raspberry Pi 5 this includes CPU, GPU, and other zones.
# Values are in millidegrees Celsius — divide by 1000 in Grafana.
# Used to correlate NTP frequency drift with thermal changes.
# ---------------------------------------------------------------------------
[[inputs.file]]
  files = ["/sys/class/thermal/thermal_zone0/temp"]
  name_override = "cpu_temp"
  data_format = "value"
  data_type = "integer"
# ---------------------------------------------------------------------------
# Input: RTC backup battery voltage
# Reads the Pi 5's onboard RTC backup battery (J5/BAT connector) voltage,
# trickle-charged to 3.0V via dtparam=rtc_bbat_vchg=3000000 in config.txt.
#
# Distinct from the GPS module's ML1220 backup cell, which has no
# software-readable voltage — this is the Pi 5's own RTC battery, separate
# hardware managed by the SoC's PMIC.
#
# Values are in microvolts — divide by 1,000,000 in Grafana.
# Slower 60s interval since this changes much more slowly than CPU temp.
# ---------------------------------------------------------------------------
[[inputs.file]]
  files = ["/sys/class/rtc/rtc0/battery_voltage"]
  name_override = "rtc_battery_voltage"
  data_format = "value"
  data_type = "integer"
  interval = "60s"
# ---------------------------------------------------------------------------
# Output: InfluxDB v2 on raspberrypi-utility
# ---------------------------------------------------------------------------
[[outputs.influxdb_v2]]
  urls = ["http://192.168.1.248:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "homelab"
  bucket = "ntp"
  timeout = "30s"