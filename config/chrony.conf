# /etc/chrony/chrony.conf
# GPS-disciplined Stratum 1 NTP server — raspberrypi-ntp
#
# Sources: u-blox GPS module via gpsd (NMEA SHM) + PPS on /dev/pps0
# Upstream NTP servers used as fallback/sanity check only.

# Include configuration files found in /etc/chrony/conf.d.
confdir /etc/chrony/conf.d

# ---------------------------------------------------------------------------
# Upstream NTP Servers (fallback / sanity check)
# ---------------------------------------------------------------------------
# Debian default pool commented out; using specific trusted servers instead.
#pool 2.debian.pool.ntp.org iburst

server time.nist.gov iburst
server time.cloudflare.com iburst
server time.apple.com iburst
server 0.us.pool.ntp.org iburst
server 1.us.pool.ntp.org iburst
server 2.us.pool.ntp.org iburst
server 3.us.pool.ntp.org iburst
## DON'T USE GOOGLE — leap-smeared, conflicts with leapsectz right/UTC
## server time.google.com iburst
# utcnist.colorado.edu resolves to india.colorado.edu — stratum 0 / unreachable
#server utcnist.colorado.edu

# ---------------------------------------------------------------------------
# GPS Refclocks
# ---------------------------------------------------------------------------

# NMEA via gpsd shared memory (SHM 0)
#   refid NMEA  — label for this source
#   offset 0.105 — measured serial latency offset in seconds (tune to your hardware)
#   precision 1e-3 — NMEA is millisecond-level; not highly precise on its own
#   poll 0 — poll every 2^0 = 1 second
#   filter 3 — median of 3 most recent samples (smooths NMEA jitter)
refclock SHM 0 refid NMEA offset 0.105 precision 1e-3 poll 0 filter 3

# PPS via /dev/pps0 (GPIO 18)
#   lock NMEA — inherit time-of-day from the NMEA source above
#   offset 0.0 — no offset; PPS is inherently precise
#   poll 3 — poll every 2^3 = 8 seconds
#   trust — mark as trusted so chrony keeps using it even after NMEA is
#            flagged as a false ticker
refclock PPS /dev/pps0 refid PPS lock NMEA offset 0.0 poll 3 trust

# ---------------------------------------------------------------------------
# Server Behavior
# ---------------------------------------------------------------------------

# Allow NTP queries from all hosts on the network
allow 0.0.0.0/0

# Enable manual time setting via chronyc settime
manual

# Orphan mode: if GPS is lost, report stratum 1 and continue serving time
# so downstream clients don't lose sync
local stratum 1

# ---------------------------------------------------------------------------
# Standard Directives
# ---------------------------------------------------------------------------

# Use time sources from DHCP.
sourcedir /run/chrony-dhcp

# Use NTP sources found in /etc/chrony/sources.d.
sourcedir /etc/chrony/sources.d

# NTP authentication key file
keyfile /etc/chrony/chrony.keys

# Clock drift file
driftfile /var/lib/chrony/chrony.drift

# Save NTS keys and cookies.
ntsdumpdir /var/lib/chrony

# Enable logging of tracking, measurements, and statistics
log tracking measurements statistics
logdir /var/log/chrony

# Reject time updates that would adjust the clock by more than 100 ppm
maxupdateskew 100.0

# Sync the hardware RTC to system time every 11 minutes
rtcsync

# Step the clock (rather than slew) if offset > 1 second, but only during
# the first 3 clock updates after startup
makestep 1 3

# Get TAI-UTC offset and leap seconds from the system tz database.
# NOTE: Comment this out if you add leap-smeared sources (Cloudflare NTS,
# Google) to avoid a conflict between smeared and non-smeared time.
leapsectz right/UTC
